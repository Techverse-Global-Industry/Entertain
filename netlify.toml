[build]
  base = "promote"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--include=dev"
  VITE_CLOUD_UPLOADS = "1"
  PROMOTE_HOSTING = "supabase"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "pg"]
  included_files = ["server/cloud-worker.mjs", "server/postgres-sql.mjs", "public/media/henry-soiree.jpeg"]

[[plugins]]
  package = "./netlify/plugins/backend"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tulccbuhclbepnyvrfiv.supabase.co; font-src 'self'; media-src 'self' blob: https://tulccbuhclbepnyvrfiv.supabase.co; connect-src 'self' https://tulccbuhclbepnyvrfiv.supabase.co; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
