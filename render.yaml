# Paid, always-on backend for the Netlify website and PWA.
# Applying this Blueprint creates billable compute and a persistent disk.
# Create the Netlify project first, then provide the prompted environment values.
services:
  - type: web
    name: tg-entertainment-api
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    repo: https://github.com/Techverse-Global-Industry/Entertain
    branch: main
    rootDir: promote
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: entertainment-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: TENANT_ROUTING
        value: path
      - key: VAPID_SUBJECT
        value: mailto:tgidevs@gmail.com
      - key: APP_URL
        sync: false
      - key: BASE_DOMAIN
        sync: false
      - key: NETLIFY_SITE_ID
        sync: false
      - key: PROMOTE_PROXY_SECRET
        sync: false
